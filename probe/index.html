<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>BitChord Probe</title>
<style>
  :root { --bg:#0C0A0E; --surface:#1C1820; --text:#F2F0F5; --dim:#B2ACBA; --faint:#827C8C; --accent:#FA586A; --ok:#4ADE80; --bad:#FA586A; --warn:#FBBF24; }
  html, body { margin:0; width:1920px; height:1080px; overflow:hidden; background:var(--bg); color:var(--text);
    font-family: "Samsung One", "SamsungOneUI", "Roboto", "Helvetica Neue", Arial, sans-serif; }
  main { position:absolute; top:54px; left:96px; right:96px; bottom:54px; display:flex; flex-direction:column; }
  header { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:24px; }
  h1 { margin:0; font-size:44px; font-weight:800; letter-spacing:-0.5px; }
  h1 span { color:var(--accent); }
  .hint { font-size:24px; color:var(--dim); }
  #env { font-size:20px; color:var(--faint); margin-bottom:20px; line-height:1.45; white-space:pre-wrap; }
  #list { list-style:none; margin:0 -20px; padding:0; display:flex; flex-wrap:wrap; }
  #list li { box-sizing:border-box; width:calc(50% - 40px); margin:0 20px 10px; display:flex; align-items:flex-start; background:var(--surface); border-radius:14px; padding:12px 18px; min-height:56px; }
  .pill { flex:none; margin-right:16px; min-width:92px; text-align:center; font-size:20px; font-weight:700; border-radius:999px; padding:6px 0; background:#26222A; color:var(--dim); }
  .pass .pill { background:rgba(74,222,128,.16); color:var(--ok); }
  .fail .pill { background:rgba(250,88,106,.16); color:var(--bad); }
  .info .pill { background:rgba(251,191,36,.14); color:var(--warn); }
  .name { font-size:24px; font-weight:600; }
  .detail { font-size:19px; color:var(--dim); margin-top:3px; word-break:break-word; }
  #verdict { margin-top:auto; font-size:30px; font-weight:700; padding-top:18px; }
</style>
</head>
<body>
<main>
  <header>
    <h1><span>BitChord</span> TV probe</h1>
    <div class="hint">OK: run again · Back: exit</div>
  </header>
  <div id="env"></div>
  <ul id="list"></ul>
  <div id="verdict">Running…</div>
</main>
<script src="probe.js"></script>
</body>
</html>
